name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EVENTS_API_BASE_URL: http://127.0.0.1:5000

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --file dockerfile --tag events-api:latest .

      - name: Start API container
        run: docker run --detach --publish 127.0.0.1:5000:5000 --name events-api events-api:latest

      - name: Check API health
        run: |
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 2 --max-time 5 "$EVENTS_API_BASE_URL/api/health"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Print container logs on failure
        if: failure()
        run: |
          if docker container inspect events-api >/dev/null 2>&1; then
            docker logs events-api
          fi

      - name: Clean up container
        if: always()
        run: |
          if docker container inspect events-api >/dev/null 2>&1; then
            docker rm --force events-api
          fi
